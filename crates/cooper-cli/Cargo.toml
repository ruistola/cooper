[package]
name = "cooper-cli"
version = "0.1.0"
edition = "2021"
description = "The Cooper command-line driver: filesystem project loading, the build pipeline, and diagnostic rendering."

[[bin]]
name = "cooper"
path = "src/main.rs"

[lib]
name = "cooper_cli"
path = "src/lib.rs"

[dependencies]
cooper-frontend = { path = "../cooper-frontend" }
toml = "0.8"
cooper-ir = { path = "../cooper-ir" }
cooper-llvm = { path = "../cooper-llvm" }
